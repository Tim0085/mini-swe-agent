
name: Pytest

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - v2.0
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.cursor/**'
      - '.github/workflows/build-docs.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/pylint.yaml'
  pull_request:
    branches:
      - main
      - v2.0
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.cursor/**'
      - '.github/workflows/build-docs.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/pylint.yaml'

jobs:
  test:
    name: Upstream tests (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Update apt package list
        run: sudo apt-get update
      - name: Install podman
        run: sudo apt-get install -y podman
      - name: Install bubblewrap
        run: |
          sudo apt-get install -y bubblewrap
          sudo chmod u+s $(which bwrap)  # ensure we can set uid permissions
      - name: Install singularity/apptainer
        run: |
            sudo apt-get install -y wget
            cd /tmp
            wget https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb
            sudo dpkg -i apptainer_1.3.4_amd64.deb || sudo apt-get install -f -y
            # Create singularity symlink for compatibility
            sudo ln -sf /usr/bin/apptainer /usr/bin/singularity
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
            uv pip install --python ${Python_ROOT_DIR} -e '.[full]'
      - name: Configure mini-swe-agent
        run: |
          mini-extra config set MSWEA_CONFIGURED 'true'
          mini-extra config set OPENAI_API_KEY '${{ secrets.OPENAI_API_KEY }}'
          mini-extra config set OPENROUTER_API_KEY '${{ secrets.OPENROUTER_API_KEY }}'
          # mini-extra config set PORTKEY_API_KEY '${{ secrets.PORTKEY_API_KEY }}'
          mini-extra config set REQUESTY_API_KEY '${{ secrets.REQUESTY_API_KEY }}'
      - name: Run pytest
        run: python -m pytest tests -v --cov=minisweagent --cov-branch --cov-report=xml -n auto
      - name: Upload coverage reports to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

  workbench:
    name: Mini workbench (Windows, Python 3.12)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locate Git Bash
        run: |
          $taskGitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $taskBash = Join-Path $taskGitRoot 'bin/bash.exe'
          if (!(Test-Path -LiteralPath $taskBash)) { throw 'Git Bash is missing from the runner.' }
          "MINI_GIT_BASH=$taskBash" >> $env:GITHUB_ENV
      - name: Install workbench test dependencies
        run: python -m pip install -r local_setup/requirements.txt -r local_setup/webui/requirements-test.txt 'swebench==5.0.2'
      - name: Apply existing Windows evaluator newline fix
        run: python local_setup/fix_swebench_windows_newlines.py
      - name: Run isolated offline workbench tests
        run: python -m pytest -c local_setup/webui/tests/pytest.ini local_setup/webui/tests -q
